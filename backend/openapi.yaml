      summary: Calendario de reservas del complejo en una fecha
      description: |
        HU-14 (criterio 1). Roles: `AdminComplejo` (dueño del complejo) o `Superadmin`. Devuelve todas las canchas (también las inactivas)
        y todas las reservas del día, para pintar el calendario con las canchas en columnas. Cada reserva incluye `nombreJugador` (nombre del jugador de la web, `null` en reservas manuales).
      security:
