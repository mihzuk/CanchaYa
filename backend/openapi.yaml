                      $ref: '#/components/schemas/Tarifa'
        '400':
          $ref: '#/components/responses/Validacion'
        '404':
          $ref: '#/components/responses/CanchaNoEncontrada'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      operationId: crearTarifa
      tags: [Complejos]
      summary: Crear una tarifa para una cancha
      description: |
        HU-08. Roles: `AdminComplejo` (dueño) o `Superadmin`. `horaFin` debe ser posterior a `horaInicio`.
        No puede cruzarse con otra tarifa activa del mismo tipo de día (409 `TARIFA_CRUZADA`).
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TarifaInput'
      responses:
        '201':
          description: Tarifa creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TarifaEnvuelta'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/CanchaNoEncontrada'
        '409':
          $ref: '#/components/responses/TarifaCruzada'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /canchas/{id}/franjas:
    get:
      operationId: listarFranjas
      tags: [Complejos]
      summary: Franjas horarias de una cancha en una fecha
      description: |
        HU-07 a HU-09. Público (la sesión es opcional). Calcula las franjas del día según el horario (especial o habitual), la tarifa vigente y los bloqueos.
        Estados: `libre`, `bloqueada`, `pasada` (ya transcurrió, hora de Bogotá) o `sin_tarifa` (precio `null`).
        Es la vista de configuración del complejo: **no** marca las franjas reservadas. Para ver la disponibilidad real
        (incluye `reservada` y `partido_abierto`) usar `GET /complejos/{id}/disponibilidad` (HU-10.2).
        Una cancha inactiva o de un complejo no activo solo la ve su administrador o un Superadmin.
      security:
        - {}
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: fecha
          in: query
          required: true
          schema:
            type: string
            format: date
          example: '2026-12-05'
      responses:
        '200':
          description: Cancha y franjas del día (vacías si el complejo no abre ese día).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FranjasDia'
        '400':
          $ref: '#/components/responses/Validacion'
        '404':
          $ref: '#/components/responses/CanchaNoEncontrada'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /tarifas/{id}:
    put:
      operationId: actualizarTarifa
      tags: [Complejos]
      summary: Modificar una tarifa
      description: |
        HU-08 (criterio 3) / RN-04. Roles: `AdminComplejo` (dueño) o `Superadmin`.
        No edita la tarifa: crea una nueva y desactiva la anterior (las reservas ya hechas conservan su precio). El `id` devuelto es el de la tarifa nueva.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TarifaInput'
      responses:
        '200':
          description: Nueva tarifa vigente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TarifaEnvuelta'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/TarifaNoEncontrada'
        '409':
          $ref: '#/components/responses/TarifaCruzada'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    delete:
      operationId: eliminarTarifa
      tags: [Complejos]
      summary: Eliminar (desactivar) una tarifa
      description: 'HU-08 / RN-04. Roles: `AdminComplejo` (dueño) o `Superadmin`. Es una baja lógica; las reservas existentes no cambian.'
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Tarifa desactivada.
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/TarifaNoEncontrada'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /canchas/{id}/bloqueos:
    get:
      operationId: listarBloqueos
      tags: [Complejos]
      summary: Listar los bloqueos de una cancha
      description: |
        HU-09. Roles: `AdminComplejo` (dueño) o `Superadmin`. Por defecto lista desde hoy hasta 60 días después; `desde` y `hasta` (inclusive) cambian el rango.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: desde
          in: query
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Bloqueos del rango.
          content:
            application/json:
              schema:
                type: object
                required: [bloqueos]
                properties:
                  bloqueos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Bloqueo'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/CanchaNoEncontrada'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      operationId: crearBloqueo
      tags: [Complejos]
      summary: Bloquear una cancha por mantenimiento
      description: |
        HU-09. Roles: `AdminComplejo` (dueño) o `Superadmin`. Fecha y hora locales de Bogotá. `fechaFin` debe ser posterior a `fechaInicio` y no estar en el pasado.
        HU-09 (criterio 2): si hay reservas activas en el rango no se bloquea y responde 409 `BLOQUEO_CON_RESERVAS` con las reservas en `datos.reservas`.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BloqueoInput'
      responses:
        '201':
          description: Bloqueo creado.
          content:
            application/json:
              schema:
                type: object
                required: [bloqueo]
                properties:
                  bloqueo:
                    $ref: '#/components/schemas/Bloqueo'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/CanchaNoEncontrada'
        '409':
          description: Hay reservas activas en el rango (`BLOQUEO_CON_RESERVAS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: BLOQUEO_CON_RESERVAS
                  mensaje: Hay reservas en ese rango. Reprográmalas o cancélalas antes de bloquear.
                  datos:
                    reservas:
                      - { id: 12, codigo: CY-000012, canchaId: 3, fecha: '2026-12-05', horaInicio: '18:00', horaFin: '19:00' }
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /bloqueos/{id}:
    delete:
      operationId: eliminarBloqueo
      tags: [Complejos]
      summary: Eliminar un bloqueo
      description: 'HU-09. Roles: `AdminComplejo` (dueño de la cancha) o `Superadmin`. Libera las franjas bloqueadas.'
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Bloqueo eliminado.
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          description: El bloqueo (`BLOQUEO_NO_ENCONTRADO`) no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: { codigo: BLOQUEO_NO_ENCONTRADO, mensaje: El bloqueo no existe } }
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # ------------------------------------------------------------------ Reservas (EP-03)
  /disponibilidad:
    get:
      operationId: buscarDisponibilidad
      tags: [Reservas]
      summary: Buscar canchas disponibles en una fecha
      description: |
        HU-10 (criterios 1 y 3). Público, sin sesión. Devuelve los complejos activos con canchas que tienen al menos una franja `libre`
        en la fecha (y en el rango `horaDesde` inclusive a `horaHasta` exclusivo, que filtra por hora de inicio), con las franjas libres y el precio mínimo (`precioDesde`).
        Orden: por distancia si se envían `lat` y `lng`; si no, por `precioDesde` ascendente. `distanciaKm` solo viene con coordenadas.
        Si no hay resultados y se envió `horaDesde`, `sugerencias` trae hasta 6 franjas libres de ese día, las más cercanas a esa hora.
        `lat` y `lng` deben enviarse juntas; `horaHasta` debe ser posterior a `horaDesde`.
        `limitado` es `true` cuando hay más canchas que las revisadas y el resultado puede estar incompleto (conviene filtrar por ciudad o tipo de fútbol).
      security:
        - {}
      parameters:
        - name: fecha
          in: query
          required: true
          schema:
            type: string
            format: date
          example: '2026-12-05'
        - name: ciudad
          in: query
          schema:
            type: string
            maxLength: 80
        - name: barrio
          in: query
          schema:
            type: string
            maxLength: 80
        - name: tipoFutbol
          in: query
          schema:
            $ref: '#/components/schemas/TipoFutbol'
        - name: horaDesde
          in: query
          schema:
            $ref: '#/components/schemas/Hora'
        - name: horaHasta
          in: query
          schema:
            $ref: '#/components/schemas/Hora'
        - name: lat
          in: query
