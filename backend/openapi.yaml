          application/json:
            schema:
              $ref: '#/components/schemas/HorarioHabitualInput'
      responses:
        '200':
          description: Horarios guardados, con advertencias.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HorariosGuardados'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/ComplejoNoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /complejos/{id}/horarios-especiales:
    post:
      operationId: guardarHorarioEspecial
      tags: [Complejos]
      summary: Definir un horario especial para una fecha
      description: |
        HU-07 (criterio 2). Roles: `AdminComplejo` (dueño) o `Superadmin`. El horario especial reemplaza al habitual solo ese día.
        La fecha no puede estar en el pasado. Si ya existe uno para la fecha se reemplaza.
        Devuelve advertencias si quedan reservas fuera del horario.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HorarioEspecialInput'
      responses:
        '200':
          description: Horarios guardados, con advertencias.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HorariosGuardados'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/ComplejoNoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

