openapi: 3.0.3
info:
  title: CanchaYa API
  version: 0.1.0
  license:
    name: MIT
  description: |
    API REST de CanchaYa. Se documenta aquí cada endpoint a medida que se implementa (HT-03, DoD de cada historia).

    Autenticación: `Authorization: Bearer <token>` (JWT de 2 horas).
    Errores: `{ "error": { "codigo", "mensaje", "detalles?", "datos?" } }` con códigos HTTP 400, 401, 402, 403, 404, 409, 502 y 500.
    Cualquier endpoint puede responder 409 `CONFLICTO_CONCURRENTE` cuando la base de datos detecta un interbloqueo o un conflicto de serialización; es seguro reintentar la petición.

    Convenciones generales:
    - Fechas de calendario `YYYY-MM-DD`; horas `HH:MM` (24 h, zona America/Bogota). Como entrada también se acepta `HH:MM:SS`, y `24:00` representa la medianoche de cierre.
    - Dinero: enteros en pesos colombianos (COP), sin decimales.
    - Los identificadores son enteros positivos.
    - Un JSON mal formado responde 400 `JSON_INVALIDO`; un cuerpo mayor de 100 kb responde 413 `CUERPO_DEMASIADO_GRANDE`; una ruta inexistente responde 404 `RUTA_NO_ENCONTRADA`.
    - Los endpoints con límite de peticiones (HT-13) responden 429 `DEMASIADAS_PETICIONES` e incluyen las cabeceras `RateLimit-Limit`, `RateLimit-Remaining` y `Retry-After`.

    Reservas y pagos (Sprint 2):
    - Ciclo de vida de una reserva: `pendiente_pago` (retenida 15 minutos, RN-02) -> `confirmada` (abono pagado) -> `pagada` (saldo en cero) -> `completada` o `no_asistio`;
      también `cancelada` y `expirada`. Solo `pendiente_pago`, `confirmada` y `pagada` ocupan la franja (RN-01).
    - Un 404 `RESERVA_NO_ENCONTRADA` también se devuelve cuando la reserva existe pero no es del usuario ni de su complejo (no se revela su existencia).
    - Pasarela de pagos SIMULADA (HT-08): no se cobra dinero real ni se guardan datos de tarjeta. Para probar el rechazo (402 `PAGO_RECHAZADO`):
      con `metodo: tarjeta`, un `datos.numeroTarjeta` que termine en `0002` se rechaza (cualquier otro número se aprueba);
      con `pse` o `nequi` (y también con tarjeta), `datos.resultado: "rechazado"` fuerza el rechazo. Sin `datos` el pago se aprueba.
      Un rechazo queda registrado como pago `rechazado`, la reserva sigue `pendiente_pago` y se puede reintentar mientras dure la retención.
      Al resolver un reembolso de un pago en línea la pasarela simulada siempre aprueba.
      En producción la pasarela simulada se niega a arrancar salvo que `PERMITIR_PAGOS_SIMULADOS=true` (solo para entornos de demostración).
servers:
  - url: http://localhost:3000/api
tags:
  - name: Auth            # EP-01
    description: Registro, sesión, recuperación de contraseña y perfil (EP-01, HU-01 a HU-04).
  - name: Complejos       # EP-02
    description: Complejos, canchas, horarios, tarifas y bloqueos (EP-02, HU-05 a HU-09).
  - name: Reservas        # EP-03
    description: Disponibilidad, reservas, historial y calendario del complejo (EP-03, HU-10, HU-11, HU-13, HU-14, HT-05).
  - name: Pagos           # EP-04
    description: Abonos y pagos, cancelaciones, reprogramaciones y reembolsos (EP-04, HU-12, HU-16 a HU-18, HT-08).

  - name: Equipos         # EP-05
    description: Pendiente.

  - name: Busca Partido   # EP-06
    description: Pendiente.

  - name: Notificaciones  # EP-07
    description: Pendiente.

  - name: Calificaciones  # EP-08
    description: Pendiente.

  - name: Administración  # EP-09
    description: Pendiente.

  - name: Sistema
    description: Estado del servicio.
paths:
  /health:
    get:
      operationId: estadoServicio
      tags: [Sistema]
      security: []
      summary: Estado del servicio y de la base de datos
      description: Comprueba que la API responde y que la base de datos acepta consultas. No requiere sesión.
      responses:
        '200':
          description: Servicio y base de datos operativos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
              example: { estado: ok, baseDeDatos: ok }
        '503':
          description: La base de datos no responde.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
              example: { estado: degradado, baseDeDatos: sin conexión }

  # ------------------------------------------------------------------ Auth (EP-01)
  /auth/registro:
    post:
      operationId: registrarUsuario
      tags: [Auth]
      summary: Registrar una cuenta de jugador
      description: |
        HU-01. Crea la cuenta con rol `Jugador`, envía el correo de verificación (enlace válido 24 horas) e inicia sesión de inmediato.
        El correo se normaliza a minúsculas. RNF-03: se exige aceptar el tratamiento de datos (Ley 1581 de 2012).
        Límite: 20 peticiones por hora por IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registro'
      responses:
        '201':
          description: Cuenta creada. Devuelve la sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
        '400':
          $ref: '#/components/responses/Validacion'
        '409':
          description: El correo (`CORREO_EN_USO`) o el nombre de usuario (`USERNAME_EN_USO`) ya existen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: { codigo: CORREO_EN_USO, mensaje: El correo ya está en uso } }
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /auth/login:
    post:
      operationId: iniciarSesion
      tags: [Auth]
      summary: Iniciar sesión
      description: |
        HU-02 / HT-04. Devuelve un JWT de 2 horas. Tras 5 intentos fallidos seguidos la cuenta se bloquea 15 minutos (403 `CUENTA_BLOQUEADA`).
        No se revela si el correo existe (siempre 401 `CREDENCIALES_INVALIDAS`).
        Límite: 10 peticiones por minuto por IP y correo.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Sesión iniciada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          description: Correo o contraseña incorrectos (`CREDENCIALES_INVALIDAS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: { codigo: CREDENCIALES_INVALIDAS, mensaje: Correo o contraseña incorrectos } }
        '403':
          description: Cuenta bloqueada por intentos fallidos (`CUENTA_BLOQUEADA`) o suspendida/desactivada (`CUENTA_INACTIVA`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: { codigo: CUENTA_BLOQUEADA, mensaje: Tu cuenta está bloqueada por intentos fallidos. Intenta de nuevo en 15 minutos. } }
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /auth/logout:
    post:
      operationId: cerrarSesion
      tags: [Auth]
      summary: Cerrar sesión
      description: |
        HU-02. El JWT no tiene estado en el servidor: cerrar sesión consiste en descartar el token en el cliente.
        No exige token y siempre responde 204.
      security: []
      responses:
        '204':
          description: Sesión cerrada (sin contenido).

  /auth/verificar-correo:
    post:
      operationId: verificarCorreo
      tags: [Auth]
      summary: Confirmar el correo con el enlace recibido
      description: |
        HU-01 (criterio 4). Consume el token de verificación enviado por correo (válido 24 horas, de un solo uso).
        Límite: 10 peticiones por minuto por IP y correo del cuerpo (el cuerpo no lleva correo, así que aplica por IP).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenEnlace'
      responses:
        '204':
          description: Correo verificado.
        '400':
          description: Datos inválidos (`VALIDACION`), enlace expirado (`TOKEN_EXPIRADO`) o enlace inválido o ya usado (`TOKEN_INVALIDO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: { codigo: TOKEN_EXPIRADO, mensaje: El enlace expiró. Solicita uno nuevo. } }
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /auth/reenviar-verificacion:
    post:
      operationId: reenviarVerificacion
      tags: [Auth]
      summary: Reenviar el correo de verificación
      description: |
        HU-01. Requiere sesión (cualquier rol). Si el correo ya está verificado no hace nada. Sin cuerpo.
        Límite: 5 peticiones cada 15 minutos por IP.
      security:
        - bearer: []
      responses:
        '204':
          description: Solicitud aceptada (sin contenido).
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaInactiva'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /auth/recuperar-contrasena:
    post:
      operationId: recuperarContrasena
      tags: [Auth]
      summary: Solicitar enlace de recuperación de contraseña
      description: |
        HU-03 (criterio 1). Envía un enlace válido 30 minutos si el correo existe y la cuenta está activa.
        La respuesta es siempre la misma para no revelar si el correo está registrado.
        Límite: 5 peticiones cada 15 minutos por IP y correo.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecuperarContrasena'
      responses:
        '202':
          description: Solicitud aceptada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
              example:
                mensaje: Si el correo está registrado, te enviamos un enlace para restablecer la contraseña. Revisa tu bandeja de entrada.
        '400':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /auth/restablecer-contrasena:
    post:
      operationId: restablecerContrasena
      tags: [Auth]
      summary: Restablecer la contraseña con el enlace recibido
      description: |
        HU-03 (criterio 2). Un enlace vencido (30 minutos) o ya usado se rechaza y se debe solicitar uno nuevo.
        Límite: 10 peticiones por minuto por IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestablecerContrasena'
      responses:
        '204':
          description: Contraseña actualizada.
        '400':
          description: Datos inválidos (`VALIDACION`), enlace expirado (`TOKEN_EXPIRADO`) o inválido/ya usado (`TOKEN_INVALIDO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: { codigo: TOKEN_INVALIDO, mensaje: El enlace no es válido o ya fue usado. } }
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /auth/yo:
    get:
      operationId: obtenerMiPerfil
      tags: [Auth]
      summary: Obtener mi perfil
      description: HU-04. Devuelve los datos completos de la cuenta autenticada (cualquier rol).
      security:
        - bearer: []
      responses:
        '200':
          description: Perfil del usuario autenticado.
          content:
            application/json:
              schema:
                type: object
                required: [usuario]
                properties:
                  usuario:
                    $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaInactiva'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    put:
      operationId: actualizarMiPerfil
      tags: [Auth]
      summary: Actualizar mi perfil
      description: |
        HU-04. Reemplaza los datos editables del perfil (cualquier rol). `fotoUrl`, `posicionPreferida` y `nivel` son obligatorios en el cuerpo pero admiten `null`.
        El correo, el nombre de usuario y la fecha de nacimiento no se pueden cambiar.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Perfil'
      responses:
        '200':
          description: Perfil actualizado.
          content:
            application/json:
              schema:
                type: object
                required: [usuario]
                properties:
                  usuario:
                    $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaInactiva'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /auth/yo/contrasena:
    put:
      operationId: cambiarContrasena
      tags: [Auth]
      summary: Cambiar mi contraseña
      description: |
        HU-03 / HU-04. Requiere la contraseña actual. Cualquier rol. Límite: 10 peticiones por minuto por IP.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioContrasena'
      responses:
        '204':
          description: Contraseña cambiada.
        '400':
          description: Datos inválidos (`VALIDACION`) o contraseña actual incorrecta (`CONTRASENA_ACTUAL_INCORRECTA`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: { codigo: CONTRASENA_ACTUAL_INCORRECTA, mensaje: La contraseña actual no es correcta } }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaInactiva'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /usuarios/{username}:
    get:
      operationId: obtenerPerfilPublico
      tags: [Auth]
      summary: Ver el perfil público de un jugador
      description: |
        HU-04 (criterio 2). Público, sin sesión. Nunca expone correo ni celular.
        Un usuario desactivado responde 404. `partidosJugados`, `fairPlay` y `equipos` los completan otros módulos (por ahora 0, null y []).
        Un `username` con formato inválido responde 400 `VALIDACION`.
      security: []
      parameters:
        - name: username
          in: path
          required: true
          description: Nombre de usuario (3 a 30 caracteres).
          schema:
            type: string
            minLength: 3
            maxLength: 30
            pattern: '^[a-zA-Z0-9_.]+$'
          example: juan.perez
      responses:
        '200':
          description: Perfil público.
          content:
            application/json:
              schema:
                type: object
                required: [perfil]
                properties:
                  perfil:
                    $ref: '#/components/schemas/PerfilPublico'
        '400':
          $ref: '#/components/responses/Validacion'
        '404':
          description: El jugador no existe (`USUARIO_NO_ENCONTRADO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: { codigo: USUARIO_NO_ENCONTRADO, mensaje: El jugador no existe } }
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # ------------------------------------------------------------------ Complejos (EP-02)
  /servicios:
    get:
      operationId: listarServicios
      tags: [Complejos]
      summary: Catálogo de servicios de un complejo
      description: HU-05. Lista los servicios que un complejo puede ofrecer (parqueadero, cafetería, etc.). Público.
      security: []
      responses:
        '200':
          description: Catálogo de servicios.
          content:
            application/json:
              schema:
                type: object
                required: [servicios]
                properties:
                  servicios:
                    type: array
                    items:
                      $ref: '#/components/schemas/Servicio'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /complejos:
    get:
      operationId: buscarComplejos
      tags: [Complejos]
      summary: Buscar complejos activos
      description: |
        HU-05 (criterio 2) / HU-06. Público. Solo devuelve complejos en estado `activo`, ordenados por nombre.
        `q` busca por nombre o barrio (sin distinguir mayúsculas); `ciudad` es una coincidencia exacta sin distinguir mayúsculas.
      security: []
      parameters:
        - name: ciudad
          in: query
          schema:
            type: string
            maxLength: 80
          example: Bogotá
        - name: q
          in: query
          description: Texto a buscar en nombre o barrio.
          schema:
            type: string
            maxLength: 80
        - name: tipoFutbol
          in: query
          description: Solo complejos con al menos una cancha activa de este tipo.
          schema:
            $ref: '#/components/schemas/TipoFutbol'
        - name: servicio
          in: query
          description: Id de un servicio que el complejo debe ofrecer.
          schema:
            type: integer
            minimum: 1
        - name: pagina
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: tamano
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
      responses:
        '200':
          description: Página de resultados.
          content:
            application/json:
              schema:
                type: object
                required: [complejos, total, pagina, tamano]
                properties:
                  complejos:
                    type: array
                    items:
                      $ref: '#/components/schemas/ComplejoResumen'
                  total:
                    type: integer
                    description: Total de complejos que cumplen los filtros.
                  pagina:
                    type: integer
                  tamano:
                    type: integer
        '400':
          $ref: '#/components/responses/Validacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      operationId: crearComplejo
      tags: [Complejos]
      summary: Registrar un complejo
      description: |
        HU-05 (criterio 1). Cualquier usuario autenticado puede registrar un complejo; el solicitante pasa a rol `AdminComplejo`.
        El complejo queda en estado `pendiente` hasta que un Superadmin lo apruebe. Genera el evento `ComplejoRegistrado`.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplejoInput'
      responses:
        '201':
          description: Complejo creado (estado `pendiente`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplejoEnvuelto'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaInactiva'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /mis-complejos:
    get:
      operationId: listarMisComplejos
      tags: [Complejos]
      summary: Listar mis complejos
      description: |
        HU-05. Roles: `AdminComplejo` o `Superadmin`. Devuelve los complejos administrados por el usuario en cualquier estado
        (máximo 50, sin paginación).
      security:
        - bearer: []
      responses:
        '200':
          description: Complejos del administrador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplejosResumenLista'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /complejos/pendientes:
    get:
      operationId: listarComplejosPendientes
      tags: [Complejos]
      summary: Listar complejos pendientes de aprobación
      description: |
        HU-05 / HU-33. Rol: `Superadmin`. Complejos en estado `pendiente` (máximo 50, sin paginación).
      security:
        - bearer: []
      responses:
        '200':
          description: Complejos pendientes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplejosResumenLista'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /complejos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: obtenerComplejo
      tags: [Complejos]
      summary: Detalle de un complejo
      description: |
        HU-05 / HU-06 / HU-07. Público (la sesión es opcional). Incluye canchas, horarios y servicios.
        Un complejo que no está `activo` solo lo ve su administrador o un Superadmin; para el resto responde 404.
        El público solo ve canchas activas y fechas especiales vigentes (hoy o futuras); `esGestor` indica si quien consulta es el dueño o Superadmin.
        Un token inválido o vencido se trata como visitante (no responde 401).
      security:
        - {}
        - bearer: []
      responses:
        '200':
          description: Detalle del complejo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplejoDetalle'
        '400':
          $ref: '#/components/responses/Validacion'
        '404':
          $ref: '#/components/responses/ComplejoNoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    put:
      operationId: actualizarComplejo
      tags: [Complejos]
      summary: Actualizar un complejo
      description: |
        HU-05. Roles: `AdminComplejo` (solo el dueño del complejo) o `Superadmin`. Reemplaza todos los datos y los servicios (`servicioIds`).
        Un complejo `rechazado` que se corrige vuelve a `pendiente`.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplejoInput'
      responses:
        '200':
          description: Complejo actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplejoEnvuelto'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/ComplejoNoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /complejos/{id}/servicios:
    put:
      operationId: reemplazarServiciosComplejo
      tags: [Complejos]
      summary: Reemplazar los servicios de un complejo
      description: |
        HU-05. Roles: `AdminComplejo` (dueño) o `Superadmin`. Sustituye la lista completa de servicios.
        Un id de servicio inexistente responde 400 `VALIDACION` (campo `servicioIds`).
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiciosInput'
      responses:
        '200':
          description: Complejo con sus servicios actualizados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplejoEnvuelto'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/ComplejoNoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /complejos/{id}/fotos:
    post:
      operationId: agregarFotoComplejo
      tags: [Complejos]
      summary: Agregar una foto al complejo
      description: |
        HU-05. Roles: `AdminComplejo` (dueño) o `Superadmin`. La URL debe ser https. Máximo 10 fotos por complejo.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FotoInput'
      responses:
        '201':
          description: Foto agregada.
          content:
            application/json:
              schema:
                type: object
                required: [foto]
                properties:
                  foto:
                    $ref: '#/components/schemas/Foto'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/ComplejoNoEncontrado'
        '409':
          description: Se alcanzó el máximo de 10 fotos (`MAXIMO_FOTOS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: { codigo: MAXIMO_FOTOS, mensaje: Un complejo puede tener máximo 10 fotos } }
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /complejos/{id}/fotos/{fotoId}:
    delete:
      operationId: eliminarFotoComplejo
      tags: [Complejos]
      summary: Eliminar una foto del complejo
      description: 'HU-05. Roles: `AdminComplejo` (dueño) o `Superadmin`.'
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: fotoId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: Foto eliminada.
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          description: El complejo (`COMPLEJO_NO_ENCONTRADO`) o la foto (`FOTO_NO_ENCONTRADA`) no existen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: { codigo: FOTO_NO_ENCONTRADA, mensaje: La foto no existe } }
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /complejos/{id}/aprobacion:
    patch:
      operationId: resolverAprobacionComplejo
      tags: [Complejos]
      summary: Aprobar o rechazar un complejo
      description: |
        HU-33 (criterio 1) / HU-05 (criterio 2). Rol: `Superadmin`. Solo aplica a complejos `pendiente`.
        Para rechazar (`aprobar: false`) el `motivo` es obligatorio. Genera los eventos `ComplejoAprobado` o `ComplejoRechazado`.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Aprobacion'
            examples:
              aprobar:
                value: { aprobar: true }
              rechazar:
                value: { aprobar: false, motivo: Faltan fotos de las canchas }
      responses:
        '200':
          description: Complejo con su nuevo estado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplejoEnvuelto'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/ComplejoNoEncontrado'
        '409':
          description: El complejo ya fue aprobado o rechazado (`COMPLEJO_YA_RESUELTO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: { codigo: COMPLEJO_YA_RESUELTO, mensaje: El complejo ya fue aprobado o rechazado } }
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /complejos/{id}/canchas:
    post:
      operationId: crearCancha
      tags: [Complejos]
      summary: Crear una cancha en un complejo
      description: |
        HU-06. Roles: `AdminComplejo` (dueño) o `Superadmin`. Si no se envía `capacidadJugadores` se usa `tipoFutbol * 2`.
        El nombre debe ser único dentro del complejo.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanchaInput'
      responses:
        '201':
          description: Cancha creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanchaEnvuelta'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/ComplejoNoEncontrado'
        '409':
          $ref: '#/components/responses/CanchaDuplicada'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /canchas/{id}:
    put:
      operationId: actualizarCancha
      tags: [Complejos]
      summary: Actualizar una cancha
      description: |
        HU-06 (criterio 3). Roles: `AdminComplejo` (dueño del complejo de la cancha) o `Superadmin`.
        Reemplaza todos los datos. Desactivar (`estado: inactiva`) conserva el historial: las canchas nunca se borran.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanchaInput'
      responses:
        '200':
          description: Cancha actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanchaEnvuelta'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/CanchaNoEncontrada'
        '409':
          $ref: '#/components/responses/CanchaDuplicada'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /complejos/{id}/horarios:
    get:
      operationId: listarHorarios
      tags: [Complejos]
      summary: Listar los horarios de un complejo
      description: |
        HU-07. Roles: `AdminComplejo` (dueño) o `Superadmin`. Devuelve el horario habitual (por día de semana) y las fechas especiales.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Horarios del complejo.
          content:
            application/json:
              schema:
                type: object
                required: [horarios]
                properties:
                  horarios:
                    type: array
                    items:
                      $ref: '#/components/schemas/Horario'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/ComplejoNoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    put:
      operationId: guardarHorarioHabitual
      tags: [Complejos]
      summary: Reemplazar el horario habitual
      description: |
        HU-07 (criterios 1 y 3). Roles: `AdminComplejo` (dueño) o `Superadmin`. Reemplaza el horario semanal; los días que no se envíen quedan cerrados.
        Cada día puede aparecer una sola vez. La hora de cierre debe ser posterior a la de apertura y alcanzar al menos un turno completo.
        Si quedan reservas activas fuera del nuevo horario no se eliminan: se devuelven en `advertencias.reservasFueraDeHorario`.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HorarioHabitualInput'
      responses:
        '200':
          description: Horarios guardados, con advertencias.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HorariosGuardados'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/ComplejoNoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /complejos/{id}/horarios-especiales:
    post:
      operationId: guardarHorarioEspecial
      tags: [Complejos]
      summary: Definir un horario especial para una fecha
      description: |
        HU-07 (criterio 2). Roles: `AdminComplejo` (dueño) o `Superadmin`. El horario especial reemplaza al habitual solo ese día.
        La fecha no puede estar en el pasado. Si ya existe uno para la fecha se reemplaza.
        Devuelve advertencias si quedan reservas fuera del horario.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HorarioEspecialInput'
      responses:
        '200':
          description: Horarios guardados, con advertencias.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HorariosGuardados'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/ComplejoNoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /complejos/{id}/horarios-especiales/{fecha}:
    delete:
      operationId: eliminarHorarioEspecial
      tags: [Complejos]
      summary: Eliminar el horario especial de una fecha
      description: 'HU-07. Roles: `AdminComplejo` (dueño) o `Superadmin`. La fecha vuelve a regirse por el horario habitual.'
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: fecha
          in: path
          required: true
          schema:
            type: string
            format: date
          example: '2026-12-24'
      responses:
        '204':
          description: Horario especial eliminado.
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          description: El complejo (`COMPLEJO_NO_ENCONTRADO`) no existe o no hay horario especial en esa fecha (`HORARIO_NO_ENCONTRADO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: { codigo: HORARIO_NO_ENCONTRADO, mensaje: No hay un horario especial en esa fecha } }
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /canchas/{id}/tarifas:
    get:
      operationId: listarTarifas
      tags: [Complejos]
      summary: Listar las tarifas activas de una cancha
      description: |
        HU-08. Público (la sesión es opcional). Solo tarifas activas, ordenadas por tipo de día y hora de inicio.
        Una cancha inactiva o de un complejo no activo solo la ve su administrador o un Superadmin; para el resto responde 404.
      security:
        - {}
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Tarifas de la cancha.
          content:
            application/json:
              schema:
                type: object
                required: [tarifas]
                properties:
                  tarifas:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tarifa'
        '400':
          $ref: '#/components/responses/Validacion'
        '404':
          $ref: '#/components/responses/CanchaNoEncontrada'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      operationId: crearTarifa
      tags: [Complejos]
      summary: Crear una tarifa para una cancha
      description: |
        HU-08. Roles: `AdminComplejo` (dueño) o `Superadmin`. `horaFin` debe ser posterior a `horaInicio`.
        No puede cruzarse con otra tarifa activa del mismo tipo de día (409 `TARIFA_CRUZADA`).
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TarifaInput'
      responses:
        '201':
          description: Tarifa creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TarifaEnvuelta'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/CanchaNoEncontrada'
        '409':
          $ref: '#/components/responses/TarifaCruzada'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /canchas/{id}/franjas:
    get:
      operationId: listarFranjas
      tags: [Complejos]
      summary: Franjas horarias de una cancha en una fecha
      description: |
        HU-07 a HU-09. Público (la sesión es opcional). Calcula las franjas del día según el horario (especial o habitual), la tarifa vigente y los bloqueos.
        Estados: `libre`, `bloqueada`, `pasada` (ya transcurrió, hora de Bogotá) o `sin_tarifa` (precio `null`).
        Es la vista de configuración del complejo: **no** marca las franjas reservadas. Para ver la disponibilidad real
        (incluye `reservada` y `partido_abierto`) usar `GET /complejos/{id}/disponibilidad` (HU-10.2).
        Una cancha inactiva o de un complejo no activo solo la ve su administrador o un Superadmin.
      security:
        - {}
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: fecha
          in: query
          required: true
          schema:
            type: string
            format: date
          example: '2026-12-05'
      responses:
        '200':
          description: Cancha y franjas del día (vacías si el complejo no abre ese día).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FranjasDia'
        '400':
          $ref: '#/components/responses/Validacion'
        '404':
          $ref: '#/components/responses/CanchaNoEncontrada'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /tarifas/{id}:
    put:
      operationId: actualizarTarifa
      tags: [Complejos]
      summary: Modificar una tarifa
      description: |
        HU-08 (criterio 3) / RN-04. Roles: `AdminComplejo` (dueño) o `Superadmin`.
        No edita la tarifa: crea una nueva y desactiva la anterior (las reservas ya hechas conservan su precio). El `id` devuelto es el de la tarifa nueva.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TarifaInput'
      responses:
        '200':
          description: Nueva tarifa vigente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TarifaEnvuelta'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/TarifaNoEncontrada'
        '409':
          $ref: '#/components/responses/TarifaCruzada'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    delete:
      operationId: eliminarTarifa
      tags: [Complejos]
      summary: Eliminar (desactivar) una tarifa
      description: 'HU-08 / RN-04. Roles: `AdminComplejo` (dueño) o `Superadmin`. Es una baja lógica; las reservas existentes no cambian.'
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Tarifa desactivada.
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/TarifaNoEncontrada'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /canchas/{id}/bloqueos:
    get:
      operationId: listarBloqueos
      tags: [Complejos]
      summary: Listar los bloqueos de una cancha
      description: |
        HU-09. Roles: `AdminComplejo` (dueño) o `Superadmin`. Por defecto lista desde hoy hasta 60 días después; `desde` y `hasta` (inclusive) cambian el rango.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: desde
          in: query
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Bloqueos del rango.
          content:
            application/json:
              schema:
                type: object
                required: [bloqueos]
                properties:
                  bloqueos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Bloqueo'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/CanchaNoEncontrada'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      operationId: crearBloqueo
      tags: [Complejos]
      summary: Bloquear una cancha por mantenimiento
      description: |
        HU-09. Roles: `AdminComplejo` (dueño) o `Superadmin`. Fecha y hora locales de Bogotá. `fechaFin` debe ser posterior a `fechaInicio` y no estar en el pasado.
        HU-09 (criterio 2): si hay reservas activas en el rango no se bloquea y responde 409 `BLOQUEO_CON_RESERVAS` con las reservas en `datos.reservas`.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BloqueoInput'
      responses:
        '201':
          description: Bloqueo creado.
          content:
            application/json:
              schema:
                type: object
                required: [bloqueo]
                properties:
                  bloqueo:
                    $ref: '#/components/schemas/Bloqueo'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/CanchaNoEncontrada'
        '409':
          description: Hay reservas activas en el rango (`BLOQUEO_CON_RESERVAS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: BLOQUEO_CON_RESERVAS
                  mensaje: Hay reservas en ese rango. Reprográmalas o cancélalas antes de bloquear.
                  datos:
                    reservas:
                      - { id: 12, codigo: CY-000012, canchaId: 3, fecha: '2026-12-05', horaInicio: '18:00', horaFin: '19:00' }
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /bloqueos/{id}:
    delete:
      operationId: eliminarBloqueo
      tags: [Complejos]
      summary: Eliminar un bloqueo
      description: 'HU-09. Roles: `AdminComplejo` (dueño de la cancha) o `Superadmin`. Libera las franjas bloqueadas.'
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Bloqueo eliminado.
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          description: El bloqueo (`BLOQUEO_NO_ENCONTRADO`) no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: { codigo: BLOQUEO_NO_ENCONTRADO, mensaje: El bloqueo no existe } }
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # ------------------------------------------------------------------ Reservas (EP-03)
  /disponibilidad:
    get:
      operationId: buscarDisponibilidad
      tags: [Reservas]
      summary: Buscar canchas disponibles en una fecha
      description: |
        HU-10 (criterios 1 y 3). Público, sin sesión. Devuelve los complejos activos con canchas que tienen al menos una franja `libre`
        en la fecha (y en el rango `horaDesde` inclusive a `horaHasta` exclusivo, que filtra por hora de inicio), con las franjas libres y el precio mínimo (`precioDesde`).
        Orden: por distancia si se envían `lat` y `lng`; si no, por `precioDesde` ascendente. `distanciaKm` solo viene con coordenadas.
        Si no hay resultados y se envió `horaDesde`, `sugerencias` trae hasta 6 franjas libres de ese día, las más cercanas a esa hora.
        `lat` y `lng` deben enviarse juntas; `horaHasta` debe ser posterior a `horaDesde`.
        `limitado` es `true` cuando hay más canchas que las revisadas y el resultado puede estar incompleto (conviene filtrar por ciudad o tipo de fútbol).
      security:
        - {}
      parameters:
        - name: fecha
          in: query
          required: true
          schema:
            type: string
            format: date
          example: '2026-12-05'
        - name: ciudad
          in: query
          schema:
            type: string
            maxLength: 80
        - name: barrio
          in: query
          schema:
            type: string
            maxLength: 80
        - name: tipoFutbol
          in: query
          schema:
            $ref: '#/components/schemas/TipoFutbol'
        - name: horaDesde
          in: query
          schema:
            $ref: '#/components/schemas/Hora'
        - name: horaHasta
          in: query
          schema:
            $ref: '#/components/schemas/Hora'
        - name: lat
          in: query
          description: Latitud del usuario (requiere `lng`).
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: lng
          in: query
          description: Longitud del usuario (requiere `lat`).
          schema:
            type: number
            minimum: -180
            maximum: 180
      responses:
        '200':
          description: Resultados agrupados por complejo, y sugerencias cuando no hay resultados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusquedaDisponibilidad'
              example:
                fecha: '2026-12-05'
                resultados:
                  - complejo: { id: 1, nombre: Complejo El Golazo, ciudad: Bogotá, barrio: Chicó, direccion: 'Calle 100 # 15-20', fotoPrincipal: null, distanciaKm: 2.4 }
                    canchas:
                      - id: 3
                        nombre: Cancha 1
                        tipoFutbol: 5
                        techada: false
                        iluminacion: true
                        franjas:
                          - { horaInicio: '18:00', horaFin: '19:00', precio: 80000, estado: libre }
                    precioDesde: 80000
                sugerencias: []
                limitado: false
        '400':
          $ref: '#/components/responses/Validacion'
        '409':
          $ref: '#/components/responses/ConflictoConcurrente'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /complejos/{id}/disponibilidad:
    get:
      operationId: disponibilidadComplejo
      tags: [Reservas]
      summary: Grilla de disponibilidad de un complejo por cancha
      description: |
        HU-10 (criterio 2). Público, sin sesión. Para cada cancha activa del complejo devuelve todas las franjas del día con su estado:
        `libre`, `reservada` (reserva activa, RN-01), `partido_abierto` (reserva con un partido de Busca Partido con cupos), `bloqueada`, `pasada` o `sin_tarifa`.
        Un complejo que no está `activo` o no existe responde 404.
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: fecha
          in: query
          required: true
          schema:
            type: string
            format: date
          example: '2026-12-05'
      responses:
        '200':
          description: Canchas del complejo con sus franjas del día.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisponibilidadComplejo'
              example:
                fecha: '2026-12-05'
                canchas:
                  - id: 3
                    nombre: Cancha 1
                    tipoFutbol: 5
                    franjas:
                      - { horaInicio: '18:00', horaFin: '19:00', precio: 80000, estado: reservada }
                      - { horaInicio: '19:00', horaFin: '20:00', precio: 80000, estado: libre }
        '400':
          $ref: '#/components/responses/Validacion'
        '404':
          $ref: '#/components/responses/ComplejoNoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /reservas:
    post:
      operationId: crearReserva
      tags: [Reservas]
      summary: Reservar una franja (queda pendiente de pago)
      description: |
        HU-11 / HT-05 / RN-01, RN-02, RN-03, RN-04, RN-06. Cualquier usuario autenticado con el correo verificado.
        Crea una reserva `pendiente_pago` retenida 15 minutos (`fechaExpiracion`); si no se paga el abono, expira y libera la franja (RN-02).
        El precio queda fijo con la tarifa vigente (RN-04) y el abono es el porcentaje del complejo (RN-03).
        La franja debe ser una del horario del día, futura, dentro de los días de anticipación permitidos, sin bloqueo y con tarifa (RN-06).
        Máximo 3 reservas sin pagar por jugador (409 `DEMASIADAS_PENDIENTES`); el límite se aplica de forma atómica por usuario, así que peticiones simultáneas no lo superan. Si dos personas reservan a la vez, la segunda recibe 409 `FRANJA_NO_DISPONIBLE` (HT-05).
        Errores 400 de franja: `FECHA_PASADA`, `FUERA_DE_ANTICIPACION`, `FUERA_DE_HORARIO`. Errores 409 de franja: `FRANJA_BLOQUEADA`, `SIN_TARIFA`.
        Límite: 10 peticiones por minuto por usuario.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearReservaInput'
      responses:
        '201':
          description: Reserva creada, pendiente de pago.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaEnvuelta'
              example:
                reserva:
                  id: 12
                  codigo: CY-000012
                  usuarioId: 7
                  canchaId: 3
                  cancha: { nombre: Cancha 1, tipoFutbol: 5 }
                  complejo: { id: 1, nombre: Complejo El Golazo, direccion: 'Calle 100 # 15-20', ciudad: Bogotá, barrio: Chicó }
                  fecha: '2026-12-05'
                  horaInicio: '18:00'
                  horaFin: '19:00'
                  precioTotal: 80000
                  abonoRequerido: 40000
                  saldoPendiente: 80000
                  totalPagado: 0
                  estado: pendiente_pago
                  origen: web
                  nombreClienteManual: null
                  celularClienteManual: null
                  reprogramadaDeId: null
                  motivoCancelacion: null
                  fechaCreacion: '2026-11-07T15:04:05.000Z'
                  fechaExpiracion: '2026-11-07T15:19:05.000Z'
                  fechaCancelacion: null
                  segundosParaPagar: 900
        '400':
          description: |
            Datos inválidos (`VALIDACION`) o franja no reservable: `FECHA_PASADA`, `FUERA_DE_ANTICIPACION` o `FUERA_DE_HORARIO`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: { codigo: FECHA_PASADA, mensaje: Esa franja ya empezó o está en el pasado. } }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: El correo no está verificado (`CORREO_NO_VERIFICADO`) o la cuenta está suspendida/desactivada (`CUENTA_INACTIVA`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: { codigo: CORREO_NO_VERIFICADO, mensaje: Confirma tu correo antes de reservar. } }
        '404':
          $ref: '#/components/responses/CanchaNoEncontrada'
        '409':
          description: |
            `FRANJA_NO_DISPONIBLE` (ya reservada), `FRANJA_BLOQUEADA`, `SIN_TARIFA` o `DEMASIADAS_PENDIENTES` (3 reservas sin pagar).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: { codigo: FRANJA_NO_DISPONIBLE, mensaje: La franja ya no está disponible } }
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /mis-reservas:
    get:
      operationId: listarMisReservas
      tags: [Reservas]
      summary: Listar mis reservas (próximas o historial)
      description: |
        HU-13. Cualquier usuario autenticado. `vista=proximas` (por defecto) trae las reservas activas que aún no terminan;
        `vista=historial` trae las pasadas o ya cerradas (canceladas, expiradas, completadas, no asistió). Sin paginación.
      security:
        - bearer: []
      parameters:
        - name: vista
          in: query
          schema:
            type: string
            enum: [proximas, historial]
            default: proximas
      responses:
        '200':
          description: Reservas del usuario.
          content:
            application/json:
              schema:
                type: object
                required: [reservas]
                properties:
                  reservas:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reserva'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaInactiva'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /reservas/{id}:
    get:
      operationId: obtenerReserva
      tags: [Reservas]
      summary: Detalle de una reserva
      description: |
        HU-11 / HU-13. Roles: el jugador dueño de la reserva, el `AdminComplejo` del complejo o `Superadmin`.
        Para cualquier otro usuario responde 404 (no se revela que existe).
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
