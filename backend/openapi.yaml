          description: El complejo (`COMPLEJO_NO_ENCONTRADO`) o la foto (`FOTO_NO_ENCONTRADA`) no existen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: { codigo: FOTO_NO_ENCONTRADA, mensaje: La foto no existe } }
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /complejos/{id}/aprobacion:
    patch:
      operationId: resolverAprobacionComplejo
      tags: [Complejos]
      summary: Aprobar o rechazar un complejo
      description: |
        HU-33 (criterio 1) / HU-05 (criterio 2). Rol: `Superadmin`. Solo aplica a complejos `pendiente`.
        Para rechazar (`aprobar: false`) el `motivo` es obligatorio. Genera los eventos `ComplejoAprobado` o `ComplejoRechazado`.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Aprobacion'
            examples:
              aprobar:
                value: { aprobar: true }
              rechazar:
                value: { aprobar: false, motivo: Faltan fotos de las canchas }
      responses:
        '200':
          description: Complejo con su nuevo estado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplejoEnvuelto'
        '400':
