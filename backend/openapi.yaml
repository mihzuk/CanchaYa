        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/ComplejoNoEncontrado'
        '409':
          description: El complejo ya fue aprobado o rechazado (`COMPLEJO_YA_RESUELTO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: { codigo: COMPLEJO_YA_RESUELTO, mensaje: El complejo ya fue aprobado o rechazado } }
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /complejos/{id}/canchas:
    post:
      operationId: crearCancha
