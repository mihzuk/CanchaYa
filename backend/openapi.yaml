            minimum: -180
            maximum: 180
      responses:
        '200':
          description: Resultados agrupados por complejo, y sugerencias cuando no hay resultados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusquedaDisponibilidad'
              example:
                fecha: '2026-12-05'
                resultados:
                  - complejo: { id: 1, nombre: Complejo El Golazo, ciudad: Bogotá, barrio: Chicó, direccion: 'Calle 100 # 15-20', fotoPrincipal: null, distanciaKm: 2.4 }
                    canchas:
                      - id: 3
                        nombre: Cancha 1
                        tipoFutbol: 5
                        techada: false
                        iluminacion: true
                        franjas:
                          - { horaInicio: '18:00', horaFin: '19:00', precio: 80000, estado: libre }
                    precioDesde: 80000
                sugerencias: []
                limitado: false
        '400':
          $ref: '#/components/responses/Validacion'
        '409':
          $ref: '#/components/responses/ConflictoConcurrente'
        '500':
