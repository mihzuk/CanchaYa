  /complejos/{id}/reservas-manuales:
    post:
      operationId: crearReservaManual
      tags: [Reservas]
      summary: Registrar una reserva manual (teléfono o en persona)
      description: |
        HU-14 (criterio 2) / HT-05. Roles: `AdminComplejo` (dueño del complejo) o `Superadmin`. La reserva nace `confirmada` (sin retención),
        con `origen: manual`, sin usuario y con los datos del cliente; ocupa la franja para todos (RN-01). Aplican las mismas reglas de franja que `POST /reservas` (RN-06).
        La cancha debe pertenecer al complejo (si no, 404 `CANCHA_NO_ENCONTRADA`). El pago se registra luego con `POST /reservas/{id}/pagos`.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservaManualInput'
      responses:
        '201':
          description: Reserva manual creada (`confirmada`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaEnvuelta'
        '400':
          description: Datos inválidos (`VALIDACION`) o franja no reservable (`FECHA_PASADA`, `FUERA_DE_ANTICIPACION`, `FUERA_DE_HORARIO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: { codigo: FUERA_DE_HORARIO, mensaje: Esa franja no está dentro del horario de atención de la cancha. } }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          description: El complejo (`COMPLEJO_NO_ENCONTRADO`) o la cancha (`CANCHA_NO_ENCONTRADA`, no es del complejo o no está disponible) no existen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: { codigo: CANCHA_NO_ENCONTRADA, mensaje: La cancha no pertenece a este complejo } }
        '409':
          description: La franja está ocupada (`FRANJA_NO_DISPONIBLE`), bloqueada (`FRANJA_BLOQUEADA`) o sin tarifa (`SIN_TARIFA`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: { codigo: FRANJA_NO_DISPONIBLE, mensaje: La franja ya no está disponible } }
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /reservas/{id}/estado:
    patch:
      operationId: cambiarEstadoReserva
      tags: [Reservas]
      summary: Marcar una reserva como completada o no asistió
      description: |
        HU-14 (criterios 3 y 4) / RN-07. Roles: `AdminComplejo` (dueño del complejo) o `Superadmin`. Solo reservas `confirmada` o `pagada`
        y solo cuando el partido ya empezó. `no_asistio` no genera reembolso (RN-07) y queda en el historial del jugador.
        Una reserva ajena responde 404 `RESERVA_NO_ENCONTRADA`.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioEstadoInput'
      responses:
