        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/CanchaNoEncontrada'
        '409':
          $ref: '#/components/responses/CanchaDuplicada'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /complejos/{id}/horarios:
    get:
      operationId: listarHorarios
      tags: [Complejos]
      summary: Listar los horarios de un complejo
      description: |
        HU-07. Roles: `AdminComplejo` (dueño) o `Superadmin`. Devuelve el horario habitual (por día de semana) y las fechas especiales.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Horarios del complejo.
          content:
            application/json:
              schema:
                type: object
                required: [horarios]
                properties:
                  horarios:
                    type: array
                    items:
                      $ref: '#/components/schemas/Horario'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/ComplejoNoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    put:
      operationId: guardarHorarioHabitual
      tags: [Complejos]
      summary: Reemplazar el horario habitual
      description: |
        HU-07 (criterios 1 y 3). Roles: `AdminComplejo` (dueño) o `Superadmin`. Reemplaza el horario semanal; los días que no se envíen quedan cerrados.
        Cada día puede aparecer una sola vez. La hora de cierre debe ser posterior a la de apertura y alcanzar al menos un turno completo.
        Si quedan reservas activas fuera del nuevo horario no se eliminan: se devuelven en `advertencias.reservasFueraDeHorario`.
      security:
        - bearer: []
      parameters:
