name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: canchaya
          POSTGRES_PASSWORD: canchaya
          POSTGRES_DB: canchaya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canchaya"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://canchaya:canchaya@localhost:5432/canchaya_test
      JWT_SECRET: secreto-solo-para-pruebas-de-integracion-continua
      NODE_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Tipos (TypeScript)
        run: npm run typecheck
      - name: Límites entre módulos
        run: npm run check:boundaries
      - name: Pruebas
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tipos y compilación
        run: npm run build
